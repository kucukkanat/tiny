name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs collapse to the newest, but a deploy that has
# already started finishes rather than leaving the site half-swapped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      # The example extension is served with the app, so the Extensions screen
      # can offer it from the same origin — and every deploy proves the loader
      # still works end to end.
      - run: bun --filter @tiny/extension-starter build
      # Extension authors get their types from here: the @tiny scope on npm
      # belongs to someone else. Versioned names, never overwritten — a reused
      # name fails a cold install with an integrity error.
      - run: bun pm pack --destination ../app/dist/pkg
        working-directory: packages/host
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
