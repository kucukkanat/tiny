name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time; a newer push waits rather than cancelling, so
# what is published is always the latest commit that finished building.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The site is the deliverable, so it is only worth publishing if the
      # checks that guard it pass first.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      # `--base` is used by the 404 page alone; every other URL is relative, so
      # the site works at this sub-path with no other configuration.
      - run: bun run build:site --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
